name: Analyze v1.0.0 package

on:
  push:
    branches:
      - release/v1.0.1-lightweight
    paths:
      - .github/workflows/repack-v1.0.1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - name: Remove failed-size v1.0.1 test release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.1 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete v1.0.1 --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes
          }

      - name: Download and inspect v1.0.0
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work, stage | Out-Null
          $url = "https://github.com/" + $env:GITHUB_REPOSITORY + "/releases/download/v1.0.0/VNVKoreanPatcher-v1.0.0.zip"
          Invoke-WebRequest -Uri $url -OutFile "work/VNVKoreanPatcher-v1.0.0.zip"
          Expand-Archive "work/VNVKoreanPatcher-v1.0.0.zip" -DestinationPath stage

          $packageRoot = Get-ChildItem stage -Directory | Select-Object -First 1
          "ZIP_BYTES=$((Get-Item 'work/VNVKoreanPatcher-v1.0.0.zip').Length)"
          "PACKAGE_ROOT=$($packageRoot.FullName)"

          function SizeOf($path) {
            if ((Get-Item $path) -is [System.IO.FileInfo]) { return (Get-Item $path).Length }
            return (Get-ChildItem $path -File -Recurse -Force | Measure-Object Length -Sum).Sum
          }

          "=== TOP LEVEL ==="
          Get-ChildItem $packageRoot.FullName -Force |
            ForEach-Object { [pscustomobject]@{ Bytes=(SizeOf $_.FullName); Name=$_.Name } } |
            Sort-Object Bytes -Descending |
            Format-Table -AutoSize

          "=== BACKEND ==="
          Get-ChildItem (Join-Path $packageRoot.FullName "Backend") -Force |
            ForEach-Object { [pscustomobject]@{ Bytes=(SizeOf $_.FullName); Name=$_.Name } } |
            Sort-Object Bytes -Descending |
            Format-Table -AutoSize

          "=== 40 LARGEST FILES ==="
          Get-ChildItem $packageRoot.FullName -File -Recurse -Force |
            Sort-Object Length -Descending |
            Select-Object -First 40 @{N='Bytes';E={$_.Length}}, @{N='Relative';E={$_.FullName.Substring($packageRoot.FullName.Length+1)}} |
            Format-Table -AutoSize
