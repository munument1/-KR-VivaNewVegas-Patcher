name: Repack v1.0.1 lightweight

on:
  push:
    branches:
      - release/v1.0.1-lightweight
    paths:
      - .github/workflows/repack-v1.0.1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repack:
    runs-on: windows-latest
    steps:
      - name: Download v1.0.0 package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work, stage, release | Out-Null
          $url = "https://github.com/" + $env:GITHUB_REPOSITORY + "/releases/download/v1.0.0/VNVKoreanPatcher-v1.0.0.zip"
          Invoke-WebRequest -Uri $url -OutFile "work/VNVKoreanPatcher-v1.0.0.zip"
          Expand-Archive "work/VNVKoreanPatcher-v1.0.0.zip" -DestinationPath stage
          $oldSize = (Get-Item "work/VNVKoreanPatcher-v1.0.0.zip").Length
          "OLD_ZIP_BYTES=$oldSize" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Trim unused Node modules
        shell: pwsh
        run: |
          $modules = Get-ChildItem stage -Directory -Recurse |
            Where-Object { $_.Name -eq "node_modules" -and $_.Parent.Name -eq "Backend" } |
            Select-Object -First 1
          if (-not $modules) { throw "Backend/node_modules not found" }

          $packageRoot = $modules.Parent.Parent.FullName
          $before = (Get-ChildItem $modules.FullName -File -Recurse | Measure-Object Length -Sum).Sum
          $top = (Get-ChildItem $modules.FullName -Force | Select-Object -ExpandProperty Name)
          "Original top-level node_modules entries: $($top -join ', ')"

          Get-ChildItem $modules.FullName -Force |
            Where-Object { $_.Name -notin @("xeditlib", "koffi") } |
            Remove-Item -Recurse -Force

          foreach ($required in @(
            "xeditlib\XEditLib.dll",
            "xeditlib\xelib.js",
            "koffi\package.json"
          )) {
            if (-not (Test-Path (Join-Path $modules.FullName $required))) {
              throw "Required backend file missing after trim: $required"
            }
          }

          $after = (Get-ChildItem $modules.FullName -File -Recurse | Measure-Object Length -Sum).Sum
          "Node modules before: $before bytes"
          "Node modules after : $after bytes"
          "NODE_MODULES_BEFORE=$before" | Out-File -FilePath $env:GITHUB_ENV -Append
          "NODE_MODULES_AFTER=$after" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PACKAGE_ROOT=$packageRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify both Node runtimes and fallback modules
        shell: pwsh
        run: |
          $backend = Join-Path $env:PACKAGE_ROOT "Backend"
          $env:VNVKR_NODE_MODULES = Join-Path $backend "node_modules"
          $probe = "require(process.env.VNVKR_NODE_MODULES + '/xeditlib'); require(process.env.VNVKR_NODE_MODULES + '/koffi'); console.log('backend-ok')"
          & (Join-Path $backend "node.exe") -e $probe
          if ($LASTEXITCODE -ne 0) { throw "UTF-8 Node backend load failed" }
          & (Join-Path $backend "node-1252.exe") -e $probe
          if ($LASTEXITCODE -ne 0) { throw "CP1252 Node backend load failed" }

      - name: Build v1.0.1 archive
        shell: pwsh
        run: |
          $zip = Join-Path (Resolve-Path release) "VNVKoreanPatcher-v1.0.1.zip"
          Compress-Archive -Path $env:PACKAGE_ROOT -DestinationPath $zip -CompressionLevel Optimal
          $newSize = (Get-Item $zip).Length
          $saved = [int64]$env:OLD_ZIP_BYTES - $newSize
          $pct = [math]::Round(($saved / [double][int64]$env:OLD_ZIP_BYTES) * 100, 1)
          "NEW_ZIP_BYTES=$newSize" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SAVED_BYTES=$saved" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SAVED_PERCENT=$pct" | Out-File -FilePath $env:GITHUB_ENV -Append

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  VNVKoreanPatcher-v1.0.1.zip" |
            Set-Content -Encoding ascii "release/VNVKoreanPatcher-v1.0.1.sha256.txt"

          @"
          # Viva New Vegas 한국어 패쳐 v1.0.1

          패키징 경량화 릴리즈입니다. 번역 적용 로직은 v1.0.0과 동일합니다.

          - YesMan-AI 전체 node_modules 대신 실제 런타임에 필요한 xeditlib + koffi만 포함
          - UTF-8 / CP1252 Node 런타임 모두 유지
          - 원본 해시가 일치하면 기존 xdelta3 빠른 경로 유지
          - 동일 플러그인이 업데이트되어 원본 해시가 달라져도 YesMan-AI/xEditLib 레코드 병합 fallback 유지
          - tNVSE/UI/라디오/폰트/TranslationData 구성 변경 없음

          이전 ZIP: $env:OLD_ZIP_BYTES bytes
          새 ZIP: $newSize bytes
          감소: $saved bytes ($pct%)
          "@ | Set-Content -Encoding utf8 "release/release-notes.md"

      - name: Publish v1.0.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.1 `
            "release/VNVKoreanPatcher-v1.0.1.zip" `
            "release/VNVKoreanPatcher-v1.0.1.sha256.txt" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Viva New Vegas 한국어 패쳐 v1.0.1" `
            --notes-file "release/release-notes.md"

      - name: Size summary
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY "## v1.0.1 package size"
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Add-Content $env:GITHUB_STEP_SUMMARY "- Old ZIP: $env:OLD_ZIP_BYTES bytes"
          Add-Content $env:GITHUB_STEP_SUMMARY "- New ZIP: $env:NEW_ZIP_BYTES bytes"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Saved: $env:SAVED_BYTES bytes ($env:SAVED_PERCENT%)"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Node modules before: $env:NODE_MODULES_BEFORE bytes"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Node modules after: $env:NODE_MODULES_AFTER bytes"
