name: Analyze v1.0.0 compressed package

on:
  push:
    branches:
      - release/v1.0.1-lightweight
    paths:
      - .github/workflows/repack-v1.0.1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - name: Download v1.0.0
        shell: pwsh
        run: |
          $url = "https://github.com/" + $env:GITHUB_REPOSITORY + "/releases/download/v1.0.0/VNVKoreanPatcher-v1.0.0.zip"
          Invoke-WebRequest -Uri $url -OutFile "VNVKoreanPatcher-v1.0.0.zip"

      - name: Inspect compressed contributors
        shell: python
        run: |
          import json, zipfile
          from pathlib import PurePosixPath

          archive = "VNVKoreanPatcher-v1.0.0.zip"
          with zipfile.ZipFile(archive) as z:
              infos = [i for i in z.infolist() if not i.is_dir()]
              print("ZIP_BYTES", sum(1 for _ in [archive]))
              print("=== 35 LARGEST BY COMPRESSED SIZE ===")
              for i in sorted(infos, key=lambda x: x.compress_size, reverse=True)[:35]:
                  print(i.compress_size, i.file_size, i.filename)

              catalog_name = next(i.filename for i in infos if i.filename.endswith("/TranslationData/catalog.json"))
              catalog = json.loads(z.read(catalog_name).decode("utf-8-sig"))
              print("=== DELTA 0021 OWNER ===")
              for entry in catalog.get("files", []):
                  vd = entry.get("verified_delta") or {}
                  if str(vd.get("payload", "")).endswith("0021.vcdiff"):
                      print(json.dumps({
                          "path": entry.get("path"),
                          "provider": entry.get("provider"),
                          "optional": entry.get("optional"),
                          "mapping_count": len(entry.get("mappings", [])),
                          "verified_delta": vd,
                      }, ensure_ascii=False))

              print("=== VERIFIED DELTAS BY ZIP COMPRESSED SIZE ===")
              by_name = {i.filename.split("TranslationData/",1)[-1]: i for i in infos if "TranslationData/" in i.filename}
              rows=[]
              for entry in catalog.get("files", []):
                  vd=entry.get("verified_delta") or {}
                  payload=vd.get("payload")
                  if payload and payload in by_name:
                      zi=by_name[payload]
                      rows.append((zi.compress_size, zi.file_size, entry.get("path"), payload))
              for row in sorted(rows, reverse=True)[:20]:
                  print(*row)

              print("=== KOFFI PLATFORM BINARIES ===")
              for i in sorted((i for i in infos if "/Backend/node_modules/koffi/build/koffi/" in i.filename and i.filename.endswith(".node")),
                              key=lambda x:x.compress_size, reverse=True):
                  print(i.compress_size, i.file_size, i.filename)
