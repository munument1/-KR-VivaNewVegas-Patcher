name: VNV v1.0.7.4 Pretendard font-only build and release

on:
  push:
    branches: [fix/vnv-pretendard-font, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and glyph-verification tools
        run: python -m pip install pyinstaller==6.22.3 fonttools==4.60.1
      - name: Download and verify v1.0.7.3 patcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .base-release | Out-Null
          gh release download v1.0.7.3 --repo munument1/-KR-VivaNewVegas-Patcher -p 'VNVKoreanPatcher-v1.0.7.3.exe' -p 'SHA256SUMS.txt' --dir .base-release
          if ($LASTEXITCODE) { throw 'Could not retrieve base release' }
          $expectedLine = Get-Content .base-release/SHA256SUMS.txt | Where-Object { $_ -match 'VNVKoreanPatcher-v1.0.7.3.exe$' } | Select-Object -First 1
          if (-not $expectedLine) { throw 'EXE checksum missing from signed release index' }
          $expected = ($expectedLine -split '\s+')[0].ToLower()
          $actual = (Get-FileHash .base-release/VNVKoreanPatcher-v1.0.7.3.exe -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw 'Official release checksum mismatch' }
          Write-Host "Verified v1.0.7.3 EXE SHA256 $actual"
      - name: Extract original resources and swap only Korean font faces
        shell: pwsh
        run: |
          python tools/extract_patcher_release_resources.py .base-release/VNVKoreanPatcher-v1.0.7.3.exe .build-resources
          if ($LASTEXITCODE) { throw 'Original resource extraction failed' }
          python tools/replace_nanumsquare_with_pretendard.py .build-resources/TranslationData
          if ($LASTEXITCODE) { throw 'Font-only catalog update failed' }
          New-Item -ItemType Directory -Force .tools/xeditlib-native | Out-Null
          Copy-Item .build-resources/Backend/* .tools/xeditlib-native/
      - name: Run font and packaging regressions
        shell: pwsh
        run: |
          foreach ($test in @('test_fonts.py', 'test_release_packaging.py')) {
            python -m unittest discover -s tests -p $test -v
            if ($LASTEXITCODE) { throw "Failed: $test" }
          }
      - name: Build standalone patcher v1.0.7.4
        shell: pwsh
        run: |
          ./tools/build_release.ps1 -Python python -Catalog .build-resources/TranslationData -BuildRoot dist/fontonly-build
          if ($LASTEXITCODE) { throw 'Standalone EXE build failed' }
          Copy-Item dist/fontonly-build/VNVKoreanPatcher.exe dist/VNVKoreanPatcher-v1.0.7.4.exe
          ./dist/VNVKoreanPatcher-v1.0.7.4.exe --package-check
          if ($LASTEXITCODE) { throw 'EXE package validation failed' }
      - name: Verify only the XML and its catalog checksum changed
        shell: pwsh
        run: |
          python tools/verify_pretendard_only_release.py .base-release/VNVKoreanPatcher-v1.0.7.3.exe dist/VNVKoreanPatcher-v1.0.7.4.exe
          if ($LASTEXITCODE) { throw 'Unexpected DLL, backend or translation modification' }
          $assets = @('dist/VNVKoreanPatcher-v1.0.7.4.exe', '.build-resources/TranslationData/font-payloads/tNVSE-71-KR-UI-source.zip')
          $hashes = foreach ($asset in $assets) {
            (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower() + '  ' + (Split-Path -Leaf $asset)
          }
          $hashes | Set-Content dist/SHA256SUMS-v1.0.7.4.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: VNVKoreanPatcher-v1.0.7.4-Pretendard-preview
          path: |
            dist/VNVKoreanPatcher-v1.0.7.4.exe
            dist/SHA256SUMS-v1.0.7.4.txt
            .build-resources/TranslationData/font-payloads/tnvse_fonts.xml
          if-no-files-found: error
      - name: Publish official v1.0.7.4 release after merge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        run: |
          $version = python -c "import vnvkr; print(vnvkr.VERSION)"
          if ($version -ne '1.0.7.4') { throw 'Release version mismatch' }
          gh release view v1.0.7.4 --repo munument1/-KR-VivaNewVegas-Patcher *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host 'Release already exists'; exit 0 }
          gh release create v1.0.7.4 dist/VNVKoreanPatcher-v1.0.7.4.exe .build-resources/TranslationData/font-payloads/tNVSE-71-KR-UI-source.zip dist/SHA256SUMS-v1.0.7.4.txt --repo munument1/-KR-VivaNewVegas-Patcher --target '${{ github.sha }}' --title 'VNV Korean Patcher v1.0.7.4 - Pretendard Fonts' --notes-file docs/releases/v1.0.7.4.md --latest
          if ($LASTEXITCODE) { throw 'Publishing release failed' }
