name: Build tNVSE Hangul outline fallback preview

on:
  push:
    branches: [fix/tnvse-hangul-glyph]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: windows-2022
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test and packaging dependencies
        run: python -m pip install pyinstaller==6.22.3 fonttools==4.60.1
      - name: Build fresh 32-bit tNVSE from pinned source with Hangul fallback
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\build_tnvse_patch.ps1 -ExtraPatch tools/tnvse/empty-hangul-outline-fallback.patch
          if errorlevel 1 exit /b 1
      - name: Validate existing UI replacement fixes with real source functions
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          python tools\tnvse\replacement_regression.py .tnvse-source build\replacement-regression.cpp
          if errorlevel 1 exit /b 1
          cl /nologo /EHsc /std:c++20 /utf-8 /Fe:build\replacement-regression.exe build\replacement-regression.cpp
          if errorlevel 1 exit /b 1
          build\replacement-regression.exe
          if errorlevel 1 exit /b 1
      - name: Restore verified release translations and apply font fallback
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/munument1/-KR-VivaNewVegas-Patcher/releases/download/v1.0.6.1/VNVKoreanPatcher-v1.0.6.1.exe' -OutFile base-release.exe
          $env:PYTHONPATH = $PWD.Path
          python tools/prepare_tnvse_patch.py --release base-release.exe --source .tnvse-source --output .build-resources
          if ($LASTEXITCODE) { throw 'Resource preparation failed' }
          python tools/add_uhc_font_fallback.py .build-resources/TranslationData
          if ($LASTEXITCODE) { throw 'Hangul fallback preparation failed' }
          New-Item -ItemType Directory -Force .tools/xeditlib-native | Out-Null
          Copy-Item .build-resources/Backend/* .tools/xeditlib-native/
      - name: Regression test font packaging
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_fonts.py -v
          if ($LASTEXITCODE) { throw 'Font packaging regression failed' }
      - name: Build and verify self-contained preview EXE
        shell: pwsh
        run: |
          ./tools/build_release.ps1 -Python python -Catalog .build-resources/TranslationData
          if ($LASTEXITCODE) { throw 'Patcher build failed' }
          ./dist/VNVKoreanPatcher.exe --package-check
          if ($LASTEXITCODE) { throw 'Patcher package check failed' }
          python tools/check_tnvse_glyph_coverage.py dist/VNVKoreanPatcher.exe
          if ($LASTEXITCODE) { throw 'Final glyph coverage and outline validation failed' }
          $checks = @('dist/VNVKoreanPatcher.exe', '.build-resources/TranslationData/font-payloads/tnvse.dll', '.build-resources/TranslationData/font-payloads/tnvse_fonts.xml')
          $checks | ForEach-Object { (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower() + '  ' + $_ } | Set-Content dist/SHA256SUMS-preview.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: VNV-Hangul-Fallback-Preview-NOT-RELEASE
          path: |
            dist/VNVKoreanPatcher.exe
            dist/SHA256SUMS-preview.txt
            .build-resources/TranslationData/font-payloads/tnvse.dll
            .build-resources/TranslationData/font-payloads/tnvse_fonts.xml
            .build-resources/TranslationData/font-payloads/tNVSE-71-KR-UI-source.zip
            .build-resources/TranslationData/font-payloads/tNVSE-GPL-3.0.txt
