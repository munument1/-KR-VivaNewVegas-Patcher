name: Build tNVSE Korean UI fix
on:
  push:
    branches: [fix/tnvse-kr-ui]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python build tools
        run: python -m pip install pyinstaller==6.22.3
      - name: Build patched upstream Win32 DLL
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\build_tnvse_patch.ps1
      - name: Regression tests using actual source functions
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          python tools\tnvse\replacement_regression.py .tnvse-source build\replacement-regression.cpp
          cl /nologo /EHsc /std:c++20 /utf-8 /Fe:build\replacement-regression.exe build\replacement-regression.cpp
          if errorlevel 1 exit /b 1
          build\replacement-regression.exe
      - name: Recover verified translation/backend payloads
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/munument1/-KR-VivaNewVegas-Patcher/releases/download/v1.0.6.1/VNVKoreanPatcher-v1.0.6.1.exe' -OutFile base-release.exe
          $env:PYTHONPATH = $PWD.Path
          python tools/prepare_tnvse_patch.py --release base-release.exe --source .tnvse-source --output .build-resources
          if ($LASTEXITCODE) { throw 'Resource preparation failed' }
          New-Item -ItemType Directory -Force .tools/xeditlib-native | Out-Null
          Copy-Item .build-resources/Backend/* .tools/xeditlib-native/
      - name: Patcher regression tests
        shell: pwsh
        run: |
          # test_vnvkr exercises the retired xdelta backend, absent from this EXE.
          $patterns = @('test_fonts.py', 'test_mcm_direct.py', 'test_output.py', 'test_release_packaging.py', 'test_runtime_mods.py', 'test_xedit.py')
          foreach ($pattern in $patterns) {
            python -m unittest discover -s tests -p $pattern -v
            if ($LASTEXITCODE) { throw "Tests failed: $pattern" }
          }
      - name: Build patcher with Korean font DLL override
        shell: pwsh
        run: |
          ./tools/build_release.ps1 -Python python -Catalog .build-resources/TranslationData
          if ($LASTEXITCODE) { throw 'Patcher build failed' }
          ./dist/VNVKoreanPatcher.exe --package-check
          if ($LASTEXITCODE) { throw 'Packaged resource check failed' }
          Copy-Item dist/VNVKoreanPatcher.exe dist/VNVKoreanPatcher-v1.0.6.2-candidate.exe
      - uses: actions/upload-artifact@v4
        with:
          name: VNV-tNVSE-KR-UI-fix-candidate
          path: |
            dist/VNVKoreanPatcher-v1.0.6.2-candidate.exe
            .build-resources/TranslationData/font-payloads/tnvse.dll
            .build-resources/TranslationData/font-payloads/tNVSE-71-KR-UI-source.zip
            .build-resources/TranslationData/font-payloads/tNVSE-GPL-3.0.txt
            .build-resources/TranslationData/font-payloads/tNVSE-KR-UI-fix.txt
